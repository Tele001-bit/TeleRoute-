<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeleRoute - Authentication</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0d0f12;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .auth-card {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .brand-header {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, #10b981, #059669);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
        }

        .brand-text h2 {
            font-size: 1.25rem;
            font-weight: 600;
        }

        .brand-text p {
            font-size: 0.85rem;
            color: #8892b0;
        }

        .welcome-title h1 {
            font-size: 1.75rem;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .welcome-title p {
            font-size: 0.9rem;
            color: #8892b0;
        }

        .tab-switcher {
            display: flex;
            background-color: #161920;
            padding: 4px;
            border-radius: 24px;
            border: 1px solid #232733;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            color: #8892b0;
            font-size: 0.9rem;
            font-weight: 500;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background-color: #ffffff;
            color: #0d0f12;
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .input-group {
            position: relative;
        }

        .input-group input {
            width: 100%;
            padding: 14px 16px;
            background-color: #161920;
            border: 1px solid #232733;
            border-radius: 12px;
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-group input:focus {
            border-color: #10b981;
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #8892b0;
            cursor: pointer;
        }

        .forgot-link {
            color: #8892b0;
            text-decoration: none;
        }

        .forgot-link:hover {
            color: #ffffff;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background-color: #ffffff;
            color: #0d0f12;
            border: none;
            border-radius: 24px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .submit-btn:hover {
            opacity: 0.9;
        }

        .explore-link {
            text-align: center;
            margin-top: 8px;
        }

        .explore-link a {
            color: #8892b0;
            font-size: 0.85rem;
            text-decoration: none;
        }

        .explore-link a:hover {
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <!-- Brand Header -->
        <div class="brand-header">
            <div class="logo-icon">T</div>
            <div class="brand-text">
                <h2>TeleRoute</h2>
                <p>Smart routing & communication solutions</p>
            </div>
        </div>

        <!-- Title -->
        <div class="welcome-title">
            <h1 id="title-text">Welcome back</h1>
            <p id="subtitle-text">Sign in to access your services and dashboard.</p>
        </div>

        <!-- Login / Sign Up Toggle -->
        <div class="tab-switcher">
            <button class="tab-btn active" onclick="switchTab('login')">Login</button>
            <button class="tab-btn" onclick="switchTab('signup')">Sign Up</button>
        </div>

        <!-- Form -->
        <form class="auth-form" onsubmit="event.preventDefault();">
            <div class="input-group">
                <input type="email" placeholder="Email address" required>
            </div>

            <div class="input-group">
                <input type="password" placeholder="Password" required>
            </div>

            <div class="form-options">
                <label class="remember-me">
                    <input type="checkbox" checked> Remember me
                </label>
                <a href="#" class="forgot-link">Forgot password?</a>
            </div>

            <button type="submit" class="submit-btn" id="submit-btn">Sign In &rarr;</button>
        </form>

        <div class="explore-link">
            <a href="#">Explore without signing in &rarr;</a>
        </div>
    </div>

    <script>
        function switchTab(mode) {
            const buttons = document.querySelectorAll('.tab-btn');
            const title = document.getElementById('title-text');
            const subtitle = document.getElementById('subtitle-text');
            const submitBtn = document.getElementById('submit-btn');

            if (mode === 'login') {
                buttons[0].classList.add('active');
                buttons[1].classList.remove('active');
                title.innerText = 'Welcome back';
                subtitle.innerText = 'Sign in to access your services and dashboard.';
                submitBtn.innerHTML = 'Sign In &rarr;';
            } else {
                buttons[1].classList.add('active');
                buttons[0].classList.remove('active');
                title.innerText = 'Create an account';
                subtitle.innerText = 'Sign up to get started with TeleRoute.';
                submitBtn.innerHTML = 'Create Account &rarr;';
            }
        }
    </script>
</body>
</html>
