<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeleRoute - Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #05070a;
            color: #ffffff;
            min-height: 100vh;
            padding: 20px 16px 90px 16px;
            max-width: 480px;
            margin: 0 auto;
            position: relative;
        }

        /* Top Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-top: 10px;
        }

        .welcome-sub {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #8a8f98;
            font-weight: 600;
        }

        .user-name {
            font-size: 1.4rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #ffffff;
            margin-top: 2px;
        }

        .profile-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: #14171f;
            border: 1px solid #262933;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .profile-btn:active {
            transform: scale(0.95);
        }

        /* Balance Card */
        .balance-card {
            background: #0f1118;
            border: 1px solid #1e2230;
            border-radius: 20px;
            padding: 22px 20px;
            position: relative;
            background-image: 
                linear-gradient(to right, rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 20px 20px;
            margin-bottom: 20px;
        }

        .balance-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #8a8f98;
            font-weight: 600;
        }

        .eye-icon {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 32px;
            height: 32px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .balance-amount {
            font-size: 2rem;
            font-weight: 800;
            margin: 12px 0 20px 0;
            letter-spacing: 1px;
        }

        .balance-actions {
            display: flex;
            gap: 12px;
        }

        .btn-primary {
            flex: 1;
            background: #ffffff;
            color: #05070a;
            border: none;
            padding: 14px;
            border-radius: 25px;
            font-size: 0.95rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-primary:active {
            opacity: 0.85;
        }

        .btn-secondary {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            color: #ffffff;
            border: 1px solid #262933;
            padding: 14px;
            border-radius: 25px;
            font-size: 0.95rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            cursor: pointer;
        }

        /* 4 Quick Actions Grid */
        .actions-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 28px;
        }

        .action-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            color: #ffffff;
            cursor: pointer;
        }

        .action-box {
            width: 100%;
            aspect-ratio: 1;
            background: #0f1118;
            border: 1px solid #1e2230;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s, border-color 0.2s;
        }

        .action-item:active .action-box {
            transform: scale(0.94);
            border-color: #3b82f6;
        }

        .action-icon-circle {
            width: 38px;
            height: 38px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .action-label {
            font-size: 0.78rem;
            color: #d1d5db;
            font-weight: 500;
        }

        /* Section Title & Card */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 700;
        }

        .view-all {
            color: #8a8f98;
            font-size: 0.85rem;
            text-decoration: none;
        }

        .activity-card {
            background: #0f1118;
            border: 1px solid #1e2230;
            border-radius: 20px;
            padding: 36px 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .receipt-icon-box {
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .activity-title {
            font-size: 0.95rem;
            font-weight: 600;
        }

        .activity-desc {
            font-size: 0.82rem;
            color: #6b7280;
        }

        /* Bottom Nav */
        .bottom-nav {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 32px);
            max-width: 448px;
            background: #0f1118;
            border: 1px solid #1e2230;
            border-radius: 30px;
            padding: 10px 20px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 10;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            text-decoration: none;
            color: #6b7280;
            font-size: 0.72rem;
            font-weight: 600;
        }

        .nav-item.active {
            color: #ffffff;
        }

        /* Interactive Bottom Sheets / Modals */
        .sheet-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(4px);
            z-index: 800;
            display: none;
            align-items: flex-end;
            justify-content: center;
        }

        .sheet-overlay.active {
            display: flex;
        }

        .sheet-card {
            width: 100%;
            max-width: 480px;
            background: #11141e;
            border-top: 1px solid #262933;
            border-radius: 28px 28px 0 0;
            padding: 24px 20px 36px 20px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            animation: slideUp 0.25s ease-out;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .sheet-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sheet-title {
            font-size: 1.15rem;
            font-weight: 700;
        }

        .sheet-close {
            background: #1a1d28;
            border: none;
            color: #8a8f98;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 1.1rem;
            cursor: pointer;
        }

        /* Form Inputs inside Modals */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-label {
            font-size: 0.8rem;
            color: #8a8f98;
            text-transform: uppercase;
            font-weight: 600;
        }

        .form-select, .form-input {
            width: 100%;
            background: #181b26;
            border: 1px solid #262933;
            color: #ffffff;
            padding: 12px 14px;
            border-radius: 12px;
            font-size: 0.95rem;
            outline: none;
        }

        .preset-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .preset-chip {
            background: #181b26;
            border: 1px solid #262933;
            padding: 10px;
            border-radius: 12px;
            text-align: center;
            font-weight: 600;
            font-size: 0.88rem;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
        }

        .preset-chip.active {
            border-color: #3b82f6;
            background: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
        }

        .price-summary {
            background: #181b26;
            border-radius: 14px;
            padding: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
        }

        .price-tag {
            font-size: 1.2rem;
            font-weight: 800;
            color: #2dd4bf;
        }

        /* Toast Popup */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-50px);
            background: #1e2230;
            color: #ffffff;
            border: 1px solid #3b82f6;
            padding: 10px 18px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            z-index: 10000;
            opacity: 0;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* Profile Screen Overlay */
        .profile-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000000;
            z-index: 999;
            display: none;
            flex-direction: column;
            padding: 16px 20px 40px 20px;
            overflow-y: auto;
        }

        .profile-screen.active {
            display: flex;
        }

        .profile-close-btn {
            background: none;
            border: none;
            color: #ffffff;
            cursor: pointer;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            margin-bottom: 12px;
        }

        .profile-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 440px;
            width: 100%;
            margin: 0 auto;
        }

        .user-profile-card {
            background: #12141a;
            border-radius: 20px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .avatar-circle {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            background: #2dd4bf;
            color: #000000;
            font-size: 1.8rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            text-transform: uppercase;
        }

        .profile-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .profile-info .name {
            font-size: 1.15rem;
            font-weight: 800;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .profile-info .email {
            font-size: 0.88rem;
            color: #6b7280;
        }

        .menu-section {
            background: #12141a;
            border-radius: 20px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .menu-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            color: #ffffff;
            background: transparent;
            border: none;
            width: 100%;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 500;
        }

        .menu-item:not(:last-child) {
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }

        .menu-item-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .menu-item-left svg {
            color: #9ca3af;
        }

        .menu-item-right {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #6b7280;
            font-size: 0.88rem;
        }

        .text-red {
            color: #f87171 !important;
        }

        .profile-id-footer {
            text-align: center;
            color: #6b7280;
            font-size: 0.82rem;
            margin-top: 18px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            cursor: pointer;
        }
    </style>
</head>

    </div>
