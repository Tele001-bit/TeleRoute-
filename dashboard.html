<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeleRoute - Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            min-height: 100vh;
            padding: 24px 20px 100px 20px;
            max-width: 480px;
            margin: 0 auto;
            position: relative;
        }

        /* Top Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-top: 8px;
        }

        .welcome-sub {
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: #62666d;
            font-weight: 600;
        }

        .user-name {
            font-size: 1.45rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #ffffff;
            margin-top: 4px;
        }

        .profile-btn {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: #0d0d0d;
            border: 1px solid #1c1d22;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .profile-btn:active {
            transform: scale(0.95);
        }

        /* Tab Content Control */
        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block !important;
            animation: fadeIn 0.2s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Balance Card */
        .balance-card {
            background-color: #000000;
            border: 1px solid #1c1d22;
            border-radius: 24px;
            padding: 24px 20px;
            position: relative;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 26px 26px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .balance-label {
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #62666d;
            font-weight: 700;
        }

        .eye-icon {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 36px;
            height: 36px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .balance-amount {
            font-size: 2.5rem;
            font-weight: 800;
            margin: 12px 0 24px 0;
            letter-spacing: -0.5px;
            display: flex;
            align-items: baseline;
            gap: 2px;
        }

        .balance-symbol {
            color: #72767d;
            font-weight: 700;
            font-size: 1.8rem;
            margin-right: 2px;
        }

        .balance-actions {
            display: flex;
            gap: 12px;
            width: 100%;
        }

        .btn-primary {
            flex: 1;
            background: #ffffff;
            color: #000000;
            border: none;
            padding: 15px;
            border-radius: 30px;
            font-size: 0.92rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            white-space: nowrap;
        }

        .btn-secondary {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            color: #ffffff;
            border: 1px solid #1f2128;
            padding: 15px;
            border-radius: 30px;
            font-size: 0.92rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            white-space: nowrap;
        }

        /* Quick Actions Grid */
        .actions-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 28px;
        }

        .action-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            color: #ffffff;
            cursor: pointer;
        }

        .action-box {
            width: 100%;
            aspect-ratio: 1;
            background: #000000;
            border: 1px solid #1c1d22;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s, border-color 0.2s;
        }

        .action-item:active .action-box {
            transform: scale(0.93);
            border-color: #3b82f6;
        }

        .action-icon-circle {
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .action-label {
            font-size: 0.74rem;
            color: #8b8f97;
            font-weight: 500;
        }

        /* Recent Activity Section */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .section-title {
            font-size: 1.15rem;
            font-weight: 800;
        }

        .view-all {
            color: #62666d;
            font-size: 0.82rem;
            text-decoration: none;
            font-weight: 600;
        }

        .activity-card {
            background: #000000;
            border: 1px solid #1c1d22;
            border-radius: 24px;
            padding: 45px 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .receipt-icon-box {
            width: 52px;
            height: 52px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .activity-title {
            font-size: 0.95rem;
            font-weight: 700;
        }

        .activity-desc {
            font-size: 0.8rem;
            color: #52565e;
        }

        /* Services Tab */
        .search-bar {
            width: 100%;
            background: #090a0d;
            border: 1px solid #1c1d22;
            border-radius: 16px;
            padding: 14px 16px;
            color: #fff;
            font-size: 0.9rem;
            margin-bottom: 18px;
            outline: none;
        }

        .service-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .service-row {
            background: #000000;
            border: 1px solid #1c1d22;
            border-radius: 18px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
        }

        .service-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .service-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: #111218;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.1rem;
        }

        .service-name {
            font-size: 0.95rem;
            font-weight: 700;
        }

        .service-price {
            font-size: 0.85rem;
            color: #8b8f97;
            font-weight: 600;
        }

        /* Activations Tab */
        .activation-item {
            background: #000000;
            border: 1px solid #1c1d22;
            border-radius: 20px;
            padding: 18px;
            margin-bottom: 12px;
        }

        .activation-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .activation-service {
            font-weight: 700;
            font-size: 0.95rem;
        }

        .activation-timer {
            font-size: 0.78rem;
            color: #f87171;
            font-weight: 600;
            background: rgba(248, 113, 113, 0.1);
            padding: 4px 8px;
            border-radius: 8px;
        }

        .activation-number {
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }

        .sms-box {
            background: #0a0b0e;
            border: 1px dashed #2a2d38;
            border-radius: 12px;
            padding: 12px;
            font-size: 0.85rem;
            color: #8b8f97;
            text-align: center;
        }

        /* Bottom Floating Bar */
        .bottom-nav {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 32px);
            max-width: 448px;
            background: #000000;
            border: 1px solid #1c1d22;
            border-radius: 35px;
            padding: 10px 24px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            text-decoration: none;
            color: #52565e;
            font-size: 0.72rem;
            font-weight: 600;
            background: none;
            border: none;
            cursor: pointer;
        }

        .nav-item svg {
            stroke: #52565e;
            transition: stroke 0.2s;
        }

        .nav-item.active {
            color: #ffffff;
        }

        .nav-item.active svg {
            stroke: #ffffff;
        }

        /* Toast Popup */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-50px);
            background: #11131a;
            color: #ffffff;
            border: 1px solid #2a2e3d;
            padding: 10px 18px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            z-index: 10000;
            opacity: 0;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* Modals & Profile Screen */
        .sheet-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(4px);
            z-index: 800;
            display: none;
            align-items: flex-end;
            justify-content: center;
        }

        .sheet-overlay.active {
            display: flex;
        }

        .sheet-card {
            width: 100%;
            max-width: 480px;
            background: #0a0a0c;
            border-top: 1px solid #1f2128;
            border-radius: 28px 28px 0 0;
            padding: 24px 20px 36px 20px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            animation: slideUp 0.22s ease-out;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .sheet-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sheet-title {
            font-size: 1.15rem;
            font-weight: 700;
        }

        .sheet-close {
            background: #181920;
            border: none;
            color: #8a8f98;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 1.1rem;
            cursor: pointer;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-label {
            font-size: 0.78rem;
            color: #62666d;
            text-transform: uppercase;
            font-weight: 700;
        }

        .form-select, .form-input {
            width: 100%;
            background: #12131a;
            border: 1px solid #222430;
            color: #ffffff;
            padding: 13px 14px;
            border-radius: 12px;
            font-size: 0.95rem;
            outline: none;
        }

        .preset-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .preset-chip {
            background: #12131a;
            border: 1px solid #222430;
            padding: 10px;
            border-radius: 12px;
            text-align: center;
            font-weight: 600;
            font-size: 0.88rem;
            cursor: pointer;
        }

        .preset-chip.active {
            border-color: #ffffff;
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
        }

        .price-summary {
            background: #12131a;
            border-radius: 14px;
            padding: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
        }

        .price-tag {
            font-size: 1.25rem;
            font-weight: 800;
            color: #ffffff;
        }

        .profile-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000000;
            z-index: 999;
            display: none;
            flex-direction: column;
            padding: 16px 20px 40px 20px;
            overflow-y: auto;
        }

        .profile-screen.active {
            display: flex;
        }

        .profile-close-btn {
            background: none;
            border: none;
            color: #ffffff;
            cursor: pointer;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            margin-bottom: 12px;
        }

        .profile-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 440px;
            width: 100%;
            margin: 0 auto;
        }

        .user-profile-card {
            background: #0a0a0c;
            border-radius: 20px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            border: 1px solid #1c1d22;
        }

        .avatar-circle {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            background: #ffffff;
            color: #000000;
            font-size: 1.8rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            text-transform: uppercase;
        }

        .profile-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .profile-info .name {
            font-size: 1.15rem;
            font-weight: 800;
            color: #ffffff;
            text-transform: uppercase;
        }

        .profile-info .email {
            font-size: 0.88rem;
            color: #62666d;
        }

        .menu-section {
            background: #0a0a0c;
            border-radius: 20px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid #1c1d22;
        }

        .menu-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            color: #ffffff;
            background: transparent;
            border: none;
            width: 100%;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 500;
        }

        .menu-item:not(:last-child) {
            border-bottom: 1px solid #15171d;
        }

        .menu-item-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .menu-item-right {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #62666d;
            font-size: 0.88rem;
        }

        .text-red {
            color: #f87171 !important;
        }

        .profile-id-footer {
            text-align: center;
            color: #62666d;
            font-size: 0.82rem;
            margin-top: 18px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Toast Notification Popup -->
    <div id="toast" class="toast">Notice</div>

    <!-- Header -->
    <div class="header">
        <div>
            <div class="welcome-sub">WELCOME BACK</div>
            <div class="user-name" id="display-header-name">USER</div>
        </div>
        
        <div class="profile-btn" id="open-profile-btn">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
            </svg>
        </div>
    </div>

    <!-- TAB 1: HOME -->
    <div id="tab-home" class="tab-content active">
        <!-- Total Balance Card -->
        <div class="balance-card">
            <div class="balance-label">TOTAL BALANCE</div>
            
            <div class="eye-icon" id="toggle-eye-btn">
                <svg id="eye-icon-svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8a8f98" stroke-width="2">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                </svg>
            </div>

            <div class="balance-amount" id="balance-container">
                <span class="balance-symbol">₦</span>
                <span id="balance-text">0.00</span>
            </div>

            <div class="balance-actions">
                <button class="btn-primary" id="open-topup-btn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    <span>Add Money</span>
