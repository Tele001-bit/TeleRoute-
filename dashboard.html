<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeleRoute - Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #05070a;
            color: #ffffff;
            min-height: 100vh;
            padding: 20px 16px 90px 16px;
            max-width: 480px;
            margin: 0 auto;
            position: relative;
        }

        /* Top Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-top: 10px;
        }

        .welcome-sub {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #8a8f98;
            font-weight: 600;
        }

        .user-name {
            font-size: 1.4rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #ffffff;
            margin-top: 2px;
        }

        /* Profile Button - FIXED: Pointer cursor and button type */
        .profile-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: #14171f;
            border: 1px solid #262933;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .profile-btn:active {
            transform: scale(0.95);
        }

        /* Balance Card */
        .balance-card {
            background: #0f1118;
            border: 1px solid #1e2230;
            border-radius: 20px;
            padding: 22px 20px;
            position: relative;
            background-image: 
                linear-gradient(to right, rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 20px 20px;
            margin-bottom: 20px;
        }

        .balance-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #8a8f98;
            font-weight: 600;
        }

        .eye-icon {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 32px;
            height: 32px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .balance-amount {
            font-size: 2rem;
            font-weight: 800;
            margin: 12px 0 20px 0;
            letter-spacing: 2px;
        }

        .balance-actions {
            display: flex;
            gap: 12px;
        }

        .btn-primary {
            flex: 1;
            background: #ffffff;
            color: #05070a;
            border: none;
            padding: 14px;
            border-radius: 25px;
            font-size: 0.95rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            cursor: pointer;
        }

        .btn-secondary {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            color: #ffffff;
            border: 1px solid #262933;
            padding: 14px;
            border-radius: 25px;
            font-size: 0.95rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            cursor: pointer;
        }

        /* 4 Quick Action Cards */
        .actions-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 28px;
        }

        .action-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            color: #ffffff;
            cursor: pointer;
        }

        .action-box {
            width: 100%;
            aspect-ratio: 1;
            background: #0f1118;
            border: 1px solid #1e2230;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .action-icon-circle {
            width: 38px;
            height: 38px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .action-label {
            font-size: 0.78rem;
            color: #d1d5db;
            font-weight: 500;
        }

        /* Recent Activity */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 700;
        }

        .view-all {
            color: #8a8f98;
            font-size: 0.85rem;
            text-decoration: none;
        }

        .activity-card {
            background: #0f1118;
            border: 1px solid #1e2230;
            border-radius: 20px;
            padding: 40px 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .receipt-icon-box {
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .activity-title {
            font-size: 0.95rem;
            font-weight: 600;
        }

        .activity-desc {
            font-size: 0.82rem;
            color: #6b7280;
        }

        /* Bottom Nav */
        .bottom-nav {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 32px);
            max-width: 448px;
            background: #0f1118;
            border: 1px solid #1e2230;
            border-radius: 30px;
            padding: 10px 20px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 10;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            text-decoration: none;
            color: #6b7280;
            font-size: 0.72rem;
            font-weight: 600;
        }

        .nav-item.active {
            color: #ffffff;
        }

        /* ================= PROFILE MENU SCREEN ================= */
        .profile-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000000;
            z-index: 999;
            display: none; /* Controlled by JS */
            flex-direction: column;
            padding: 16px 20px 40px 20px;
            overflow-y: auto;
        }

        .profile-screen.active {
            display: flex;
        }

        .profile-close-btn {
            background: none;
            border: none;
            color: #ffffff;
            cursor: pointer;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            margin-bottom: 12px;
        }

        .profile-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 440px;
            width: 100%;
            margin: 0 auto;
        }

        /* User Header Card */
        .user-profile-card {
            background: #12141a;
            border-radius: 20px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .avatar-circle {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            background: #2dd4bf;
            color: #000000;
            font-size: 1.8rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            text-transform: uppercase;
        }

        .profile-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .profile-info .name {
            font-size: 1.15rem;
            font-weight: 800;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .profile-info .email {
            font-size: 0.88rem;
            color: #6b7280;
        }

        /* Options Group Card */
        .menu-section {
            background: #12141a;
            border-radius: 20px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .menu-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            color: #ffffff;
            background: transparent;
            border: none;
            width: 100%;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 500;
        }

        .menu-item:not(:last-child) {
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }

        .menu-item-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .menu-item-left svg {
            color: #9ca3af;
        }

        .menu-item-right {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #6b7280;
            font-size: 0.88rem;
        }

        .text-red {
            color: #f87171 !important;
        }

        .profile-id-footer {
            text-align: center;
            color: #6b7280;
            font-size: 0.82rem;
            margin-top: 18px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
    </style>
</head>
